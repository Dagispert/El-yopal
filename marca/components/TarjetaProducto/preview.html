<!-- @dsCard group="Web" height=380 subtitle="Producto para la web y la carta digital" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>TarjetaProducto — El Yopal</title>
<style>
  html, body { margin: 0; }
  body { background: var(--superficie); color: var(--tinta); font-family: var(--font-texto); padding: 16px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 24px; }
  .card { background: var(--superficie-alt); border-radius: var(--radio-m); box-shadow: var(--sombra-suave); overflow: hidden; }
  .foto { height: 170px; display: grid; place-items: center; position: relative; }
  .foto .yp-tag { position: absolute; top: 12px; left: 12px; transform: rotate(-4deg); }
  .info { padding: 16px; display: flex; justify-content: space-between; align-items: end; gap: 8px; }
  .info h3 { margin: 0; font: 900 26px/1 var(--font-display); color: var(--tinta); }
  .info p { margin: 4px 0 0; font: 500 13px/1.4 var(--font-texto); color: var(--tinta-suave); }
  .pr { font: 900 24px/1 var(--font-display); color: var(--tinta); white-space: nowrap; }

</style>
</head>
<body>
<div class="grid">
  <article class="card"><div class="foto" style="background:var(--cielo)"><span class="yp-tag yp-tag--sol">Favorita</span><svg viewBox="0 0 200 200" width="130" height="130" aria-hidden="true" ><circle cx="100" cy="100" r="90" style="fill:var(--galleta);stroke:var(--granate-hondo);stroke-width:6"/><path d="M40 70 q10 -30 40 -38" style="fill:none;stroke:#F2C08A;stroke-width:8;stroke-linecap:round"/><rect x="49" y="57" width="26" height="22" rx="6" transform="rotate(14 62 70)" style="fill:var(--granate-hondo)"/><rect x="101" y="41" width="22" height="19" rx="5" transform="rotate(4 112 52)" style="fill:var(--granate-hondo)"/><rect x="126" y="78" width="28" height="24" rx="6" transform="rotate(0 140 92)" style="fill:var(--granate-hondo)"/><rect x="84" y="92" width="24" height="20" rx="5" transform="rotate(12 96 104)" style="fill:var(--granate-hondo)"/><rect x="47" y="117" width="22" height="19" rx="5" transform="rotate(-14 58 128)" style="fill:var(--granate-hondo)"/><rect x="105" y="127" width="26" height="22" rx="6" transform="rotate(6 118 140)" style="fill:var(--granate-hondo)"/><rect x="143" y="125" width="18" height="15" rx="4" transform="rotate(4 152 134)" style="fill:var(--granate-hondo)"/><rect x="76" y="144" width="16" height="14" rx="4" transform="rotate(8 84 152)" style="fill:var(--granate-hondo)"/><rect x="66" y="90" width="12" height="10" rx="3" transform="rotate(4 72 96)" style="fill:var(--granate-hondo)"/><rect x="122" y="112" width="12" height="10" rx="3" transform="rotate(-4 128 118)" style="fill:var(--granate-hondo)"/></svg></div>
    <div class="info"><div><h3>Choco chips</h3><p>Pepitas de chocolate, centro blandito.</p></div><span class="pr">2,80 €</span></div></article>
  <article class="card"><div class="foto" style="background:var(--sol)"><svg viewBox="0 0 200 200" width="130" height="130" aria-hidden="true" ><circle cx="100" cy="100" r="90" style="fill:var(--galleta);stroke:var(--granate-hondo);stroke-width:6"/><path d="M40 70 q10 -30 40 -38" style="fill:none;stroke:#F2C08A;stroke-width:8;stroke-linecap:round"/><rect x="49" y="57" width="26" height="22" rx="6" transform="rotate(14 62 70)" style="fill:var(--granate-hondo)"/><rect x="101" y="41" width="22" height="19" rx="5" transform="rotate(4 112 52)" style="fill:var(--granate-hondo)"/><rect x="126" y="78" width="28" height="24" rx="6" transform="rotate(0 140 92)" style="fill:var(--granate-hondo)"/><rect x="84" y="92" width="24" height="20" rx="5" transform="rotate(12 96 104)" style="fill:var(--granate-hondo)"/><rect x="47" y="117" width="22" height="19" rx="5" transform="rotate(-14 58 128)" style="fill:var(--granate-hondo)"/><rect x="105" y="127" width="26" height="22" rx="6" transform="rotate(6 118 140)" style="fill:var(--granate-hondo)"/><rect x="143" y="125" width="18" height="15" rx="4" transform="rotate(4 152 134)" style="fill:var(--granate-hondo)"/><rect x="76" y="144" width="16" height="14" rx="4" transform="rotate(8 84 152)" style="fill:var(--granate-hondo)"/><rect x="66" y="90" width="12" height="10" rx="3" transform="rotate(4 72 96)" style="fill:var(--granate-hondo)"/><rect x="122" y="112" width="12" height="10" rx="3" transform="rotate(-4 128 118)" style="fill:var(--granate-hondo)"/></svg></div>
    <div class="info"><div><h3>Oreo</h3><p>Masa de cacao y trozos de galleta.</p></div><span class="pr">2,80 €</span></div></article>
  <article class="card"><div class="foto" style="background:var(--granate)"><span class="yp-tag">Nuevo</span><svg viewBox="0 0 200 200" width="130" height="130" aria-hidden="true" ><circle cx="100" cy="100" r="90" style="fill:var(--galleta);stroke:var(--granate-hondo);stroke-width:6"/><path d="M40 70 q10 -30 40 -38" style="fill:none;stroke:#F2C08A;stroke-width:8;stroke-linecap:round"/><rect x="49" y="57" width="26" height="22" rx="6" transform="rotate(14 62 70)" style="fill:var(--granate-hondo)"/><rect x="101" y="41" width="22" height="19" rx="5" transform="rotate(4 112 52)" style="fill:var(--granate-hondo)"/><rect x="126" y="78" width="28" height="24" rx="6" transform="rotate(0 140 92)" style="fill:var(--granate-hondo)"/><rect x="84" y="92" width="24" height="20" rx="5" transform="rotate(12 96 104)" style="fill:var(--granate-hondo)"/><rect x="47" y="117" width="22" height="19" rx="5" transform="rotate(-14 58 128)" style="fill:var(--granate-hondo)"/><rect x="105" y="127" width="26" height="22" rx="6" transform="rotate(6 118 140)" style="fill:var(--granate-hondo)"/><rect x="143" y="125" width="18" height="15" rx="4" transform="rotate(4 152 134)" style="fill:var(--granate-hondo)"/><rect x="76" y="144" width="16" height="14" rx="4" transform="rotate(8 84 152)" style="fill:var(--granate-hondo)"/><rect x="66" y="90" width="12" height="10" rx="3" transform="rotate(4 72 96)" style="fill:var(--granate-hondo)"/><rect x="122" y="112" width="12" height="10" rx="3" transform="rotate(-4 128 118)" style="fill:var(--granate-hondo)"/></svg></div>
    <div class="info"><div><h3>Lotus</h3><p>Galleta especiada y crema Lotus.</p></div><span class="pr">2,80 €</span></div></article>
</div>
<script>
  /* Reduce cada lienzo de 1080 px al ancho de su marco */
  document.querySelectorAll('.yp-lienzo-marco').forEach(function (m) {
    var l = m.querySelector('.yp-lienzo'); var s = m.clientWidth / 1080;
    l.style.transform = 'scale(' + s + ')'; m.style.height = (l.offsetHeight * s) + 'px';
  });
</script>
</body>
</html>
