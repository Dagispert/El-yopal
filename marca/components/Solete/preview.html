<!-- @dsCard group="Marca" height=250 subtitle="La mascota, en sus tres caras, y el avatar de perfil" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Solete — El Yopal</title>
<style>
  html, body { margin: 0; }
  body { background: var(--superficie); color: var(--tinta); font-family: var(--font-texto); padding: 16px; }

  .row { display: flex; flex-wrap: wrap; gap: 24px; align-items: center; }
  figure { margin: 0; display: grid; gap: 6px; justify-items: center; }
  figure img { width: 150px; height: 150px; }
  figure img.av { width: 140px; height: 140px; border-radius: 50%; }
  figcaption { font: 700 12px/1 var(--font-rotulo); letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-suave); }

</style>
</head>
<body>
<div class="row">
  <figure><img src="/_blob/2d063f516c92a47327f68196317c1489" alt="Solete sonriendo"><figcaption>Feliz · por defecto</figcaption></figure>
  <figure><img src="/_blob/e9e1d47197e6c4648287df11caba0d31" alt="Solete guiñando un ojo"><figcaption>Guiño · ofertas</figcaption></figure>
  <figure><img src="/_blob/6dd418aa8fdde52bbe4213d66e54f2bc" alt="Solete sorprendido"><figcaption>Sorpresa · novedades</figcaption></figure>
  <figure><img class="av" src="/_blob/6153ca88c5ae272a023bdab69e1be4a4" alt="Avatar de El Yopal"><figcaption>Avatar de perfil</figcaption></figure>
</div>
<script>
  /* Reduce cada lienzo de 1080 px al ancho de su marco */
  document.querySelectorAll('.yp-lienzo-marco').forEach(function (m) {
    var l = m.querySelector('.yp-lienzo'); var s = m.clientWidth / 1080;
    l.style.transform = 'scale(' + s + ')'; m.style.height = (l.offsetHeight * s) + 'px';
  });
</script>
</body>
</html>
