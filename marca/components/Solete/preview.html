<!-- @dsCard group="Marca" height=300 subtitle="La mascota: un sol plano y luminoso" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Solete — El Yopal</title>
<style>
  html, body { margin: 0; }
  body { background: var(--superficie); color: var(--tinta); font-family: var(--font-texto); padding: 16px; }

  .row { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-end; }
  figure { margin: 0; display: grid; gap: 8px; justify-items: center; }
  .f { width: 150px; height: 150px; border-radius: var(--radio-m); display: grid; place-items: center; }
  .f img { width: 130px; height: 130px; }
  .as { width: 316px; height: 150px; border-radius: var(--radio-m); background: var(--cielo); display: flex; align-items: flex-end; justify-content: center; overflow: hidden; }
  .as img { width: 230px; display: block; }
  figcaption { font: 700 12px/1.2 var(--font-rotulo); letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-suave); text-align: center; }

</style>
</head>
<body>
<div class="row" data-theme="claro">
  <figure><div class="f" style="background:var(--granate)"><img src="/_blob/6ed061dfa0f9ef08f29f71b433321930" alt="Solete sonriendo"></div><figcaption>Feliz · por defecto</figcaption></figure>
  <figure><div class="f" style="background:var(--cielo)"><img src="/_blob/afcb9592b8df9e56acb7c77c98772cc5" alt="Solete guiñando"></div><figcaption>Guiño · ofertas</figcaption></figure>
  <figure><div class="f" style="background:var(--granate)"><img src="/_blob/197caebd84a252d8d9feaf351c3895d2" alt="Solete sorprendido"></div><figcaption>Sorpresa · novedades</figcaption></figure>
  <figure><div class="f" style="background:var(--sol)"><img src="/_blob/887e1aa1a7c46675f44622526c79a1ed" alt="Solete a una tinta"></div><figcaption>Una tinta · sobre sol</figcaption></figure>
  <figure><div class="as"><img src="/_blob/427ad19ae5098cc91368c6fb2d4a6726" alt="Solete asomando"></div><figcaption>Asomando · bordes</figcaption></figure>
</div>
<script>
  /* Reduce cada lienzo de 1080 px al ancho de su marco */
  document.querySelectorAll('.yp-lienzo-marco').forEach(function (m) {
    var l = m.querySelector('.yp-lienzo'); var s = m.clientWidth / 1080;
    l.style.transform = 'scale(' + s + ')'; m.style.height = (l.offsetHeight * s) + 'px';
  });
</script>
</body>
</html>
