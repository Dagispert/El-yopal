<!-- @dsCard group="Marca" height=340 subtitle="Logotipo y bloque de marca sobre sus tres fondos" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Logotipo — El Yopal</title>
<style>
  html, body { margin: 0; }
  body { background: var(--superficie); color: var(--tinta); font-family: var(--font-texto); padding: 16px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .t { border-radius: var(--radio-m); padding: 22px 24px; display: grid; place-items: center; min-height: 112px; }
  .t img { max-width: 100%; height: 96px; }
  .t.b img { height: 118px; }
  .lab { font: 700 12px/1 var(--font-rotulo); letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-suave); margin: 6px 2px 0; }

</style>
</head>
<body>
<div class="grid" data-theme="claro">
  <div><div class="t" style="background:var(--crema);border:1px solid var(--linea)"><img src="/_blob/14e119fe25db84bd279e3d1483998cdb" alt="El Yopal"></div><p class="lab">Granate sobre crema · principal</p></div>
  <div><div class="t" style="background:var(--granate)"><img src="/_blob/e6bd11abc0ef6264dc6e882ce14cad11" alt="El Yopal"></div><p class="lab">Crema sobre granate · toldo y redes</p></div>
  <div><div class="t" style="background:var(--sol)"><img src="/_blob/821369b3fbc76aa387486f26bc18b3dc" alt="El Yopal"></div><p class="lab">Granate hondo sobre sol · una tinta</p></div>
  <div><div class="t b" style="background:var(--granate)"><img src="/_blob/6c9291e9a1d67a9167adf8be432503e5" alt="El Yopal · Urban Express"></div><p class="lab">Bloque con rótulo · cabeceras</p></div>
</div>
<script>
  /* Reduce cada lienzo de 1080 px al ancho de su marco */
  document.querySelectorAll('.yp-lienzo-marco').forEach(function (m) {
    var l = m.querySelector('.yp-lienzo'); var s = m.clientWidth / 1080;
    l.style.transform = 'scale(' + s + ')'; m.style.height = (l.offsetHeight * s) + 'px';
  });
</script>
</body>
</html>
