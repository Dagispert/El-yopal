<!-- @dsCard group="Marca" height=300 subtitle="Logotipo y bloque de marca sobre sus tres fondos" -->
<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Logotipo — El Yopal</title>
<style>
  html, body { margin: 0; }
  body { background: var(--superficie); color: var(--tinta); font-family: var(--font-texto); padding: 16px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .t { border-radius: var(--radio-m); padding: 28px 24px; display: grid; place-items: center; min-height: 112px; }
  .t img { max-width: 100%; height: 64px; }
  .t.b img { height: 78px; }
  .lab { font: 700 12px/1 var(--font-rotulo); letter-spacing: .08em; text-transform: uppercase; color: var(--tinta-suave); margin: 6px 2px 0; }

</style>
</head>
<body>
<div class="grid" data-theme="claro">
  <div><div class="t" style="background:var(--crema);border:1px solid var(--linea)"><img src="/_blob/12adccad4733dfcf943eba0ad4a4b5a1" alt="El Yopal"></div><p class="lab">Granate sobre crema · principal</p></div>
  <div><div class="t" style="background:var(--granate)"><img src="/_blob/b0760751f6ed0575140b9b259a5d713a" alt="El Yopal"></div><p class="lab">Crema sobre granate · toldo y redes</p></div>
  <div><div class="t" style="background:var(--sol)"><img src="/_blob/79facb5e9a87d14480f3108495706d4c" alt="El Yopal"></div><p class="lab">Granate hondo sobre sol · una tinta</p></div>
  <div><div class="t b" style="background:var(--granate)"><img src="/_blob/e39690c9742b6422da073b977a83c8a0" alt="El Yopal · Urban Express"></div><p class="lab">Bloque con rótulo · cabeceras</p></div>
</div>
<script>
  /* Reduce cada lienzo de 1080 px al ancho de su marco */
  document.querySelectorAll('.yp-lienzo-marco').forEach(function (m) {
    var l = m.querySelector('.yp-lienzo'); var s = m.clientWidth / 1080;
    l.style.transform = 'scale(' + s + ')'; m.style.height = (l.offsetHeight * s) + 'px';
  });
</script>
</body>
</html>
